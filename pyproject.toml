[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepjs"
dynamic = ["version"]
description = "Deep static analysis of front-end JavaScript: API calls, secrets, hidden chunks, source maps"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "xtawb" }]
license = { text = "MIT" }
keywords = ["security", "javascript", "recon", "endpoints", "secrets", "sourcemap", "bugbounty", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []          # standard library only

[project.urls]
Homepage = "https://github.com/xtawb/deepjs"
Issues = "https://github.com/xtawb/deepjs/issues"

[project.scripts]
deepjs = "deepjs.cli:main"

[tool.setuptools.dynamic]
version = { attr = "deepjs.__version__" }

[tool.setuptools.packages.find]
include = ["deepjs*"]
