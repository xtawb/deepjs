name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install .

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v

      # tuning set + hold-out set against the regex baseline; the gates are in tests/test_core.py
      - name: Accuracy corpus
        run: python -m deepjs.corpus

      - name: CLI smoke test
        run: deepjs --version
