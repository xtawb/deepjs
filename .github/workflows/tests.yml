name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install .

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v

      # tuning set + hold-out set against the regex baseline; the gates are in tests/test_core.py
      - name: Accuracy corpus
        run: python -m deepjs.corpus

      - name: CLI smoke test
        run: deepjs --version

  parity:
    name: Parity with the Burp extension's engine
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xtawb/deepjs-burp
          path: deepjs-burp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The extension carries a Java port of this engine. Build it and require that it
      # reports exactly what this engine reports: a rule changed here must be changed there.
      - name: Build the extension
        working-directory: deepjs-burp
        run: ./gradlew --no-daemon jar
      - name: Compare the two engines
        run: python deepjs-burp/tools/parity.py --classpath deepjs-burp/build/libs/deepjs-burp.jar --engine .
