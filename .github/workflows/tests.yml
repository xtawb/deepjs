name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install .

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v

      # tuning set + hold-out set against the regex baseline; the gates are in tests/test_core.py
      - name: Accuracy corpus
        run: python -m deepjs.corpus

      - name: CLI smoke test
        run: deepjs --version

  burp-extension:
    name: Burp extension (build + harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Compiles against the oldest supported Montoya API, runs the harness (the extension
      # against a mocked Burp API, hostile input included) and the parity check: the Java
      # engine must report exactly what the Python engine reports.
      - name: Build and test
        run: python burp/build.py --test
      # The build PortSwigger's BApp Store uses. Its jar must hold the same engine.
      - name: Build with Gradle
        run: gradle --no-daemon jar
      - name: The Gradle jar agrees with the Python engine too
        run: python burp/parity.py --classpath build/libs/deepjs-burp.jar
      - uses: actions/upload-artifact@v4
        with:
          name: deepjs-burp
          path: burp/build/deepjs-burp.jar
          if-no-files-found: error
