name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install .

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v

      # tuning set + hold-out set against the regex baseline; the gates are in tests/test_core.py
      - name: Accuracy corpus
        run: python -m deepjs.corpus

      - name: CLI smoke test
        run: deepjs --version

  # Kali, Debian and Ubuntu manage their Python (PEP 668) and pip refuses to change it unless
  # told to. This runner's own Python is one of those: install a copy as a user there would,
  # and let it update itself for real.
  managed-python:
    name: deepjs update in a system-managed Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install an older-labelled copy with the system's pip
        run: |
          sed -i 's/^__version__ = .*/__version__ = "0.0.1"/' deepjs/__init__.py
          /usr/bin/python3 -m pip install --break-system-packages .
      - name: Update it
        working-directory: /tmp
        run: |
          /usr/bin/python3 - <<'EOF'
          import sys
          from deepjs import update
          assert update.externally_managed(), "this runner's Python was expected to be system-managed"
          assert update.installed_by() == "pip", update.installed_by()
          sys.exit(update.run_update(assume_yes=True, fetch=lambda: update.Release("0.4.3")))
          EOF
          /usr/bin/python3 -m deepjs --version | tee /dev/stderr | grep -qx "deepjs 0.4.3"

  parity:
    name: Parity with the Burp extension's engine
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xtawb/deepjs-burp
          path: deepjs-burp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The extension carries a Java port of this engine. Build it and require that it
      # reports exactly what this engine reports: a rule changed here must be changed there.
      - name: Build the extension
        working-directory: deepjs-burp
        run: ./gradlew --no-daemon jar
      - name: Compare the two engines
        run: python deepjs-burp/tools/parity.py --classpath deepjs-burp/build/libs/deepjs-burp.jar --engine .
